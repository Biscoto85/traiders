version: "3.8"

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traiders
      POSTGRES_USER: traiders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traiders"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API (Fastify) ──
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://traiders:${POSTGRES_PASSWORD:-changeme}@postgres:5432/traiders
      EODHD_API_KEY: ${EODHD_API_KEY}
      EODHD_BASE_URL: ${EODHD_BASE_URL:-https://eodhd.com/api}
      API_PORT: "4000"
      API_HOST: "0.0.0.0"
      NODE_ENV: production
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4000:4000"

  # ── Worker (Cron sync) ──
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://traiders:${POSTGRES_PASSWORD:-changeme}@postgres:5432/traiders
      EODHD_API_KEY: ${EODHD_API_KEY}
      EODHD_BASE_URL: ${EODHD_BASE_URL:-https://eodhd.com/api}
      SYNC_EOD_CRON: ${SYNC_EOD_CRON:-"0 22 * * 1-5"}
      SYNC_FUNDAMENTALS_CRON: ${SYNC_FUNDAMENTALS_CRON:-"0 6 * * 6"}
      SYNC_TICKERS_CRON: ${SYNC_TICKERS_CRON:-"0 3 1 * *"}
      SYNC_EXCHANGES: ${SYNC_EXCHANGES:-US}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production

  # ── Nginx reverse proxy ──
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
